<!DOCTYPE html>
<!-- wangcai-resume-page 静态简历模板 v1（v2026.9.9）
     用法：build-page.mjs 会把下方 JSON script 标签内的占位符替换为简历 JSON（schemaVersion 2）。
     产物为只读静态页：不可编辑；工具栏提供「导出 PDF」（浏览器打印）与
     「在旺财简历中编辑」（生成 #r= 深链打开旺财编辑器一键导入）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历</title>
<style>
  @page { size: A4; margin: 7mm 10mm 8mm; }
  :root { --blue: #2458b8; --text: #151515; --muted: #596273; --band: #f2f3f5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { color: var(--text); font-family: "Times New Roman", "SimHei", "黑体", "Microsoft YaHei", sans-serif; font-size: 10.5pt; line-height: 1.34; }
  a { color: var(--blue); text-decoration: none; }

  /* 工具栏（屏幕可见，打印隐藏） */
  .toolbar { position: sticky; z-index: 10; top: 6px; display: flex; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); margin: 6px auto 8px; padding: 7px 12px; border: 1px solid #d3d7df; border-radius: 8px; background: #fff; box-shadow: 0 4px 14px rgba(15, 23, 42, .12); color: #334155; font: 13px/1 Arial, "Microsoft YaHei", sans-serif; }
  .toolbar-title { color: #475569; font-weight: 700; white-space: nowrap; }
  .toolbar button { height: 32px; padding: 0 14px; border: 0; border-radius: 5px; font: inherit; font-weight: 700; cursor: pointer; transition: background .15s ease, transform .15s ease; }
  .print-button { background: var(--blue); color: #fff; }
  .print-button:hover { background: #1d4ed8; }
  .edit-button { border: 1px solid var(--blue) !important; background: #fff; color: var(--blue); }
  .edit-button:hover { background: #eff6ff; }
  .toolbar button:active { transform: translateY(1px); }
  .toolbar button:disabled { opacity: .55; cursor: not-allowed; }
  .save-status { color: #b91c1c; white-space: nowrap; font-size: 12px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 980px) { .toolbar { flex-wrap: wrap; justify-content: center; } }
  @media print { .toolbar { display: none !important; } .save-status { display: none !important; } }

  /* 纸面 */
  .sheet { width: 210mm; min-height: 297mm; padding: 7mm 10mm 8mm; margin: 0 auto; background: #fff; }
  @media screen { body { min-height: 100vh; padding: 4mm 0 12mm; background: #eef0f3; } .sheet { box-shadow: 0 2px 18px rgba(31, 41, 55, .18); } }
  @media screen and (max-width: 820px) { body { padding: 0; background: #fff; } .sheet { width: 100%; min-height: 0; box-shadow: none; } }
  @media print { .sheet { width: auto; min-height: 0; padding: 0; margin: 0; box-shadow: none; } }

  /* 头部 */
  h1 { margin: 0 0 3px; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 24pt; line-height: 1.08; font-weight: 700; }
  .header-grid { display: grid; grid-template-columns: minmax(0, 1fr) 28mm; gap: 8mm; align-items: start; }
  .job-line { margin: 1px 0 4px; color: var(--muted); font-size: 11.5pt; font-weight: 700; }
  .meta-row { display: flex; align-items: center; gap: 4px; margin: 2px 0; font-size: 11.5pt; line-height: 1.42; white-space: nowrap; }
  .meta-icon { width: 14px; height: 14px; flex: 0 0 auto; color: var(--blue); }
  .meta-row strong { font-weight: 700; }
  .separator { color: #2d2d2d; padding: 0 5px; }
  .photo-slot { width: 28mm; height: 36mm; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed #a8adb7; background: #fafafa; color: #8b919c; font: 9pt/1.2 Arial, "Microsoft YaHei", sans-serif; text-align: center; }
  .photo-slot.has-photo { border-color: transparent; background: transparent; }
  .photo-slot img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* 分区 */
  .section { margin-top: 8px; }
  .section-title { margin: 0 0 4px; padding-bottom: 2px; border-bottom: 2px solid var(--blue); color: var(--blue); font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 18.5pt; line-height: 1.03; font-weight: 700; break-after: avoid; }
  .entry { break-inside: avoid; margin-bottom: 5px; }
  .entry-band { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 3px 6px; background: var(--band); border-radius: 2px; }
  .entry-org { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 12.5pt; font-weight: 700; }
  .entry-role { color: var(--muted); font-size: 10.8pt; font-weight: 700; }
  .entry-dates { color: var(--muted); font: 10.5pt/1.2 Arial, sans-serif; white-space: nowrap; }
  .entry-content { margin: 3px 0 0; padding: 0; list-style: none; }
  .entry-content li { position: relative; padding-left: 11px; margin: 1.5px 0; }
  .entry-content li::before { content: "▪"; position: absolute; left: 0; top: 0; color: var(--blue); font-size: 9pt; }
  .skill-chips { display: flex; flex-wrap: wrap; gap: 4px 5px; margin: 3px 0 0; padding: 0; list-style: none; }
  .skill-chips li { padding: 1.5px 8px; border: 1px solid #c9d4e8; border-radius: 3px; background: #f7f9fd; color: #1d448f; font-size: 10.3pt; }
  .plain-text { margin: 3px 0 0; white-space: pre-wrap; }
  .intent-line { margin: 3px 0 0; font-size: 11pt; }
  .intent-line b { color: #1d448f; }

  @media print {
    .section, .entry, .section-title { break-inside: auto; }
    .entry { break-inside: avoid; }
    .section-title { break-after: avoid; }
  }
</style>
</head>
<body>
  <div class="toolbar" role="toolbar" aria-label="简历操作">
    <span class="toolbar-title">旺财简历 · 静态预览</span>
    <button type="button" id="btn-pdf" class="print-button">导出 PDF</button>
    <button type="button" id="btn-edit" class="edit-button">在旺财简历中编辑</button>
    <span class="save-status" id="toolbar-hint"></span>
  </div>

  <main class="sheet" id="resume" aria-live="polite"></main>

  <script type="application/json" id="wc-resume-data">__WC_RESUME_DATA__</script>
  <script>
  (function () {
    'use strict';
    var SITE_BASE = 'https://wangcaiwork.top'; // 旺财编辑器站点
    var dataEl = document.getElementById('wc-resume-data');
    var resume = null;
    try { resume = JSON.parse(dataEl.textContent); } catch (e) { resume = null; }
    if (resume && resume.type === 'wangcai-resume' && resume.resume) resume = resume.resume;

    var esc = function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
    var ICONS = {
      phone: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
      mail: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
      pin: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
      globe: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
      cake: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.9-2 4-2 5 2 8 2 4-2 4-2"/><rect x="2" y="21" width="20" height="0"/><path d="M12 7v4M12 3a1.5 1.5 0 0 0-1.5 1.5c0 .8 1.5 2 1.5 2s1.5-1.2 1.5-2A1.5 1.5 0 0 0 12 3z"/></svg>'
    };
    var fmtDate = function (d) { return String(d || '').replace(/-/g, '/'); };
    var dateRange = function (a, b) {
      if (!a && !b) return '';
      return fmtDate(a) + ' — ' + (b === '至今' ? '至今' : fmtDate(b));
    };
    var lines = function (text) {
      return String(text || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    };

    // ---------- 各分区渲染 ----------
    function renderHeader() {
      var b = (resume.basic || {});
      var metaBits = [];
      if (b.phone) metaBits.push(ICONS.phone + '<strong>' + esc(b.phone) + '</strong>');
      if (b.email) metaBits.push(ICONS.mail + esc(b.email));
      if (b.location) metaBits.push(ICONS.pin + esc(b.location));
      if (b.website) metaBits.push(ICONS.globe + '<a href="' + esc(b.website) + '" target="_blank" rel="noopener">' + esc(b.website) + '</a>');
      if (b.birth) metaBits.push(ICONS.cake + esc(b.birth));
      // 每 2 项一行
      var rows = '';
      for (var i = 0; i < metaBits.length; i += 2) {
        rows += '<div class="meta-row">' + metaBits.slice(i, i + 2).join('<span class="separator">|</span>') + '</div>';
      }
      var jobLine = (b.job || b.jobTitle) ? '<div class="job-line">' + esc([b.job, b.jobTitle].filter(Boolean).join(' · ')) + '</div>' : '';
      var genderBit = b.gender ? '<div class="job-line">' + esc(b.gender) + '</div>' : '';
      var photo = b.avatar
        ? '<div class="photo-slot has-photo"><img src="' + esc(b.avatar) + '" alt="证件照"></div>'
        : '<div class="photo-slot">证件照</div>';
      return '<header class="header-grid"><div>' +
        '<h1>' + esc(b.name || '姓名') + '</h1>' + jobLine + genderBit + rows +
        '</div>' + photo + '</header>';
    }

    function renderList(title, items, orgKey) {
      var out = '';
      (items || []).forEach(function (it) {
        var org = it[orgKey] || it.name || it.company || '';
        var roleBits = [it.position, it.major ? [it.major, it.degree].filter(Boolean).join(' · ') : '']
          .filter(Boolean).join(' · ');
        var lis = lines(it.content).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
        out += '<div class="entry">' +
          '<div class="entry-band"><span><span class="entry-org">' + esc(org) + '</span>' +
          (roleBits ? '<span class="entry-role">　' + esc(roleBits) + '</span>' : '') + '</span>' +
          '<span class="entry-dates">' + esc(dateRange(it.start, it.end)) + '</span></div>' +
          (lis ? '<ul class="entry-content">' + lis + '</ul>' : '') +
          '</div>';
      });
      return out ? section(title, out) : '';
    }

    function renderSkills() {
      var raw = (resume.skills && resume.skills.content) || '';
      var tags = String(raw).split(/[,，、\n]/).map(function (t) { return t.trim(); }).filter(Boolean);
      if (!tags.length) return '';
      return section('专业技能', '<ul class="skill-chips">' +
        tags.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>');
    }

    function renderIntent() {
      var j = resume.jobIntent || {};
      var bits = [['目标岗位', j.position], ['意向城市', j.city], ['期望薪资', j.salary], ['求职类型', j.type]]
        .filter(function (p) { return p[1]; })
        .map(function (p) { return '<b>' + p[0] + '：</b>' + esc(p[1]); });
      if (!bits.length) return '';
      return section('求职意向', '<div class="intent-line">' + bits.join('<span class="separator">｜</span>') + '</div>');
    }

    function renderCustom(cs) {
      if (!cs) return '';
      var body = '';
      if (cs.kind === 'text') body = '<div class="plain-text">' + esc(cs.content || '') + '</div>';
      else if (cs.kind === 'tags') {
        var tags = String(cs.content || '').split(/[,，、\n]/).map(function (t) { return t.trim(); }).filter(Boolean);
        body = tags.length ? '<ul class="skill-chips">' + tags.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '';
      } else { // list
        var out = '';
        (cs.items || []).forEach(function (it) {
          var lis = lines(it.content).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
          out += '<div class="entry"><div class="entry-band"><span><span class="entry-org">' +
            esc(it.name || it.company || '') + '</span>' +
            (it.position ? '<span class="entry-role">　' + esc(it.position) + '</span>' : '') + '</span>' +
            '<span class="entry-dates">' + esc(dateRange(it.start, it.end)) + '</span></div>' +
            (lis ? '<ul class="entry-content">' + lis + '</ul>' : '') + '</div>';
        });
        body = out;
      }
      return body ? section(cs.title || '其他', body) : '';
    }

    function section(title, inner) {
      return '<section class="section"><h2 class="section-title">' + esc(title) + '</h2>' + inner + '</section>';
    }

    // ---------- 按模块清单组装 ----------
    var MODULE_TITLE = {
      basic: '基本信息', skills: '专业技能', experience: '工作经历', projects: '项目经历',
      education: '教育经历', jobIntent: '求职意向', training: '培训经历', activities: '实践经历',
      honors: '荣誉奖项', certs: '证书资质', portfolio: '作品展示', research: '研究经历', coverLetter: '求职信'
    };
    var BUILTIN = {
      jobIntent: renderIntent, skills: renderSkills,
      experience: renderList.bind(null, '工作经历', resume && resume.experience, 'company'),
      projects: renderList.bind(null, '项目经历', resume && resume.projects, 'name'),
      education: renderList.bind(null, '教育经历', resume && resume.education, 'school'),
      training: renderList.bind(null, '培训经历', resume && resume.training, 'company'),
      activities: renderList.bind(null, '实践经历', resume && resume.activities, 'company'),
      research: renderList.bind(null, '研究经历', resume && resume.research, 'company')
    };

    function renderAll() {
      if (!resume || !resume.basic) {
        document.getElementById('resume').innerHTML =
          '<p style="color:#b91c1c">简历数据缺失或格式不正确（需要 schemaVersion 2 简历 JSON）。</p>';
        return;
      }
      document.title = (resume.basic.name || '简历') + ' · 简历';
      var html = renderHeader();
      var mods = Array.isArray(resume.modules) && resume.modules.length
        ? resume.modules
        : ['basic', 'skills', 'experience', 'projects', 'education'].map(function (t) { return { type: t, title: MODULE_TITLE[t] }; });
      var customs = resume.customSections || [];
      mods.forEach(function (m) {
        if (m && m.visible === false) return;
        var type = m.type;
        if (type === 'basic') return; // 已在头部渲染
        if (type === 'custom') {
          var cs = customs.filter(function (c) { return c.key === m.key || c.id === m.key; })[0];
          if (cs) html += renderCustom({ title: m.title || cs.title, kind: cs.kind, content: cs.content, items: cs.items });
          return;
        }
        var fn = BUILTIN[type];
        if (fn) html += fn();
      });
      document.getElementById('resume').innerHTML = html;
    }
    renderAll();

    // ---------- 工具栏 ----------
    document.getElementById('btn-pdf').addEventListener('click', function () {
      window.print();
    });

    function b64url(bytes) {
      var bin = '';
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    document.getElementById('btn-edit').addEventListener('click', function () {
      var btn = this, hint = document.getElementById('toolbar-hint');
      if (!resume || !resume.meta || !resume.meta.id) {
        hint.textContent = '简历数据缺失，无法生成编辑链接';
        return;
      }
      btn.disabled = true;
      hint.style.color = '#64748b';
      hint.textContent = '正在生成编辑链接…';
      var json = JSON.stringify({ type: 'wangcai-resume', schemaVersion: 2, resume: resume });
      var raw = new TextEncoder().encode(json);

      function finish(payload, isDeflated) {
        var b64 = b64url(payload);
        var url = SITE_BASE.replace(/\/+$/, '') + '/builder.html#r=' + (isDeflated ? 'r1' : 'r0') + '.' + b64;
        btn.disabled = false;
        if (b64.length > 60000) {
          hint.style.color = '#b91c1c';
          hint.textContent = '数据较大（' + Math.round(b64.length / 1024) + 'KB），如打开异常请改用 wc-data.json 导入';
        } else {
          hint.textContent = '';
        }
        var w = window.open(url, '_blank', 'noopener');
        if (!w) location.href = url; // 弹窗被拦截时当前页跳转
      }

      if (typeof CompressionStream === 'function') {
        try {
          new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer()
            .then(function (buf) {
              var deflated = new Uint8Array(buf);
              var useDef = deflated.length < raw.length;
              finish(useDef ? deflated : raw, useDef);
            })
            .catch(function () { finish(raw, false); });
          return;
        } catch (e) { /* 落到 r0 */ }
      }
      finish(raw, false);
    });
  })();
  </script>
</body>
</html>
