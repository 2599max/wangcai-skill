<!DOCTYPE html>
<!-- wangcai-resume-page 静态简历模板 v2 · 编辑器同源渲染（v2026.9.9）
     与旺财编辑器共用同一套 DOM 结构（.resume-paper / .preview-*）与同源 CSS（取自 css/render.css），
     lucide 图标内联为 SVG —— 预览即所得：静态页看到什么，深链导入编辑器后就是什么。
     build-page.mjs 把 __WC_RESUME_DATA__ 替换为简历 JSON（wangcai-resume 包装 / 裸简历 / 迁移包）。
     产物只读不可编辑；工具栏提供「导出 PDF」（浏览器打印）与「在旺财简历中编辑」（#r= 深链）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历</title>
<style>
  /* ===== 设计令牌（取自编辑器 css/base.css 浅色主题） ===== */
  :root {
    --gray-50: #f4f5f7; --gray-100: #eceef1; --gray-200: #e1e5ea;
    --gray-700: #5c6b7a; --gray-900: #17212b;
    --color-border: var(--gray-200);
    --color-text: var(--gray-700);
    --color-heading: var(--gray-900);
    --color-muted: #707991;
    --g-blue: #A21CAF;            /* var() 兜底；实际主题色由 settings.themeColor 注入 */
    --g-blue-light: #FBE7F3;
    --font-display: "Microsoft YaHei","微软雅黑","Heiti SC","黑体","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    --font-body: var(--font-display);
    --text-sm: 0.875rem;
    --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.25rem;
    --radius-sm: 8px; --radius-full: 9999px;
    --transition: 0.2s cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  @page { size: A4; margin: 0; }

  /* ===== 工具栏（屏幕可见，打印隐藏） ===== */
  .toolbar { position: sticky; z-index: 10; top: 6px; display: flex; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); margin: 6px auto 8px; padding: 7px 12px; border: 1px solid #d3d7df; border-radius: 8px; background: #fff; box-shadow: 0 4px 14px rgba(15, 23, 42, .12); color: #334155; font: 13px/1 Arial, "Microsoft YaHei", sans-serif; }
  .toolbar-title { color: #475569; font-weight: 700; white-space: nowrap; }
  .toolbar button { height: 32px; padding: 0 14px; border: 0; border-radius: 5px; font: inherit; font-weight: 700; cursor: pointer; transition: background .15s ease; }
  .print-button { background: var(--paper-theme, #2458b8); color: #fff; }
  .print-button:hover { filter: brightness(.94); }
  .edit-button { border: 1px solid var(--paper-theme, #2458b8) !important; background: #fff; color: var(--paper-theme, #2458b8); }
  .edit-button:hover { background: #f4f7fd; }
  .toolbar button:active { transform: translateY(1px); }
  .save-status { color: #b91c1c; white-space: nowrap; font-size: 12px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 980px) { .toolbar { flex-wrap: wrap; justify-content: center; } }
  @media print { .toolbar { display: none !important; } .save-status { display: none !important; } }

  /* 屏幕：灰底 + 纸面恒 210mm，窗口窄时左右滑动（ASu 同款，无缩放无回流） */
  @media screen { body { min-height: 100vh; padding: 4mm 0 12mm; background: #eef0f3; overflow-x: auto; } }
  @media print { body { padding: 0; background: #fff; } }

  /* ===== 纸面 CSS · 与编辑器 css/render.css 同源（原样搬运，去交互态） ===== */
  .resume-paper section { padding: 0; }
  .resume-paper {
    width: 210mm;
    min-height: 297mm;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin: 0 auto;
    padding: var(--resume-margin,18mm) var(--resume-margin,18mm);
    position: relative;
    font-family: var(--resume-font,"Microsoft YaHei","微软雅黑",sans-serif);
    font-size: var(--resume-font-size,14px);
    line-height: var(--resume-line-height,1.6);
    color: var(--color-text);
  }
  .resume-paper[data-paper-style="warm"]{ background:#FFFDF6; box-shadow:0 2px 12px rgba(180,150,80,.1); border-radius:2px; }
  .resume-paper[data-paper-style="minimal"]{ background:white; box-shadow:none; border:1px solid var(--color-border); border-radius:0; }
  .resume-paper[data-paper-style="dotted"]{ background: radial-gradient(circle, rgba(0,0,0,.06) 1px, transparent 1.2px) 0 0 / 18px 18px, #FFFDF6; box-shadow:0 4px 14px rgba(180,100,40,.10); border-radius:3px; }
  .resume-paper[data-paper-style="grid"]{ background: linear-gradient(to right, rgba(0,0,0,.05) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(to bottom, rgba(0,0,0,.05) 1px, transparent 1px) 0 0 / 24px 24px, #FCFCFD; box-shadow:0 2px 10px rgba(0,0,0,.08); border-radius:2px; }
  @media print { .resume-paper { width: auto; min-height: 0; margin: 0; box-shadow: none; } }

  .preview-header{ margin-bottom:var(--resume-section-gap,1em); }
  .preview-header-content{ flex:1 }
  .preview-name{
    font-family:var(--font-display);
    font-size:2em; font-weight:700; color:var(--color-heading);
    line-height:1.2; margin-bottom:0.15em;
  }
  .preview-title{ font-size:1em; color:var(--color-muted); margin-bottom:0.2em; }
  .preview-section{ margin-bottom:var(--resume-section-gap,1em); position:relative; }
  .preview-section:last-child{ margin-bottom:0 }
  .preview-section-title{
    font-family:var(--font-display);
    font-size:1em; font-weight:700;
    color:var(--preview-theme,var(--g-blue));
    text-transform:uppercase; letter-spacing:.04em;
    margin-bottom:calc(var(--resume-section-gap,1em) * 0.15);
    display:flex; align-items:center; gap:0.35em;
  }
  .preview-section-icon{
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
    width:1em;height:1em;box-sizing:border-box;
    text-align:center;line-height:1;
    color:var(--preview-theme,var(--g-blue));
  }
  .preview-section-icon svg{ width:1em;height:1em;stroke-width:1.75; display:block; }
  .preview-section-text{ display:inline; }
  .preview-block{ margin-bottom:calc(var(--resume-section-gap,1em) * 0.25); }
  .preview-block:last-child{ margin-bottom:0 }
  .preview-block-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:calc(var(--resume-section-gap,1em) * 0.08);
    flex-wrap:wrap; gap:0.1em;
  }
  .preview-block-title{ font-weight:700; font-size:1em; color:var(--color-heading); }
  .preview-block-subtitle{ font-size:0.929em; color:var(--color-muted); }
  .preview-block-time{ font-size:0.857em; color:var(--color-muted); white-space:nowrap; }
  .preview-block-link{ font-size:.86em; color:var(--preview-theme,var(--g-blue)); text-decoration:none; }
  .preview-list{ list-style:disc; padding-left:1.5em; margin-top:0.15em; }
  .preview-list li{
    font-size:0.929em; color:var(--color-text);
    line-height:var(--resume-line-height,1.6);
    margin-bottom:calc(var(--resume-section-gap,1em) * 0.1);
  }
  .preview-list ul, .preview-list ol{ margin-top:0.15em; padding-left:1.4em; }
  .preview-list ul{ list-style:circle; }
  .preview-list li.preview-li-sub{ margin-left:1.4em; }
  .preview-skills{ display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--space-2); }
  .tag{
    display:inline-flex; align-items:center;
    padding:6px 16px;
    font-family:var(--font-display);
    font-size:var(--text-sm); font-weight:500;
    border-radius:var(--radius-full);
    background:var(--gray-100); color:var(--color-text);
  }
  .preview-skills .tag-sm{
    color:var(--preview-theme,var(--g-blue));
    background:var(--preview-theme-light,var(--g-blue-light));
    border-color:transparent; font-size:0.857em;
  }

  /* 头部布局风格 */
  .preview-header.centered{ text-align:center; }
  .preview-header.centered .preview-header-photo{ margin:0 auto var(--space-2); }
  .preview-header.centered .preview-header-photo .preview-photo{ margin:0 auto; }
  .preview-header.side-photo{ display:flex; gap:var(--space-4); align-items:flex-start; }
  .preview-header.banner{
    display:flex; justify-content:space-between; align-items:center; gap:var(--space-4);
    background:var(--preview-theme,var(--g-blue)); color:white;
    padding:var(--space-4) var(--space-5);
    margin-left:calc(var(--resume-margin,18mm) * -1);
    margin-right:calc(var(--resume-margin,18mm) * -1);
    margin-top:calc(var(--resume-margin,18mm) * -1);
    margin-bottom:var(--resume-section-gap,1em);
  }
  .preview-header.banner .preview-name,
  .preview-header.banner .preview-title,
  .preview-header.banner .preview-contact,
  .preview-header.banner .preview-contact span{ color:white }
  .preview-header.banner .preview-title{ opacity:.85 }
  .preview-header.banner .preview-contact{ justify-content:flex-start }
  .preview-header.banner .preview-photo{ border-color:rgba(255,255,255,.3) }
  .preview-header.minimal{ padding-bottom:var(--space-2); border-bottom:2px solid var(--preview-theme,var(--g-blue)); }
  .preview-header.minimal .preview-header-row{ display:flex; justify-content:space-between; align-items:center; gap:var(--space-3); }
  .preview-header.minimal .preview-name{ font-size:1.6em; }
  .preview-header.minimal .preview-contact{ justify-content:flex-end; margin-top:var(--space-1); }

  /* 头像 */
  .preview-photo{ width:72px;height:96px; object-fit:cover; border:1px solid var(--color-border); flex-shrink:0; }
  .preview-header.centered .preview-photo,
  .preview-header.side-photo .preview-photo,
  .preview-header.banner .preview-photo,
  .preview-header.minimal .preview-photo{ width:72px;height:96px; object-fit:cover; border:2px solid var(--color-border); }
  .preview-photo[data-shape="rect"]{ border-radius:2px }
  .preview-photo[data-shape="circle"]{ border-radius:50% }
  .preview-photo[data-shape="circle"]{ width:64px !important; height:64px !important; }

  /* 联系方式 */
  .preview-contact{ display:flex; flex-wrap:wrap; gap:0.1em 0.55em; font-size:0.78em; color:var(--color-muted); line-height:1.5; }
  .preview-contact span{ display:flex; align-items:center; gap:3px }
  .preview-contact-icon{
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
    color:var(--g-text-secondary, #555);
    padding:1px 2px; line-height:1; vertical-align:middle;
  }
  .preview-contact-icon > svg{ width:1em;height:1em;stroke-width:1.75;display:inline-block;vertical-align:middle; }
  [data-contact-style="pill"] .preview-contact-pill{
    display:inline-flex; align-items:center; padding:2px 10px;
    border-radius:var(--radius-full);
    background:var(--preview-theme-light,var(--g-blue-light));
    color:var(--preview-theme,var(--g-blue));
    font-size:0.85em; font-weight:500;
  }

  /* 章节标题装饰 */
  [data-title-deco="underline"] .preview-section:not([data-title-deco]) .preview-section-title{ border-bottom:1.5px solid var(--preview-theme-light,var(--g-blue-light)); padding-bottom:0.1em; }
  [data-title-deco="bar"] .preview-section:not([data-title-deco]) .preview-section-title{ border-left:3px solid var(--preview-theme,var(--g-blue)); padding-left:0.5em; }
  [data-title-deco="block"] .preview-section:not([data-title-deco]) .preview-section-title{ background:var(--preview-theme,var(--g-blue)); color:white; padding:0.2em 0.6em; border-radius:var(--radius-sm); }
  [data-title-deco="plain"] .preview-section:not([data-title-deco]) .preview-section-title{ border:none; padding:0; }
  [data-title-deco="icon-circle"] .preview-section:not([data-title-deco]) .preview-section-icon{ display:inline-flex; align-items:center; justify-content:center; width:1.6em;height:1.6em; border-radius:50%; background:var(--preview-theme-light,var(--g-blue-light)); color:var(--preview-theme,var(--g-blue)); font-size:0.85em; flex-shrink:0; }
  [data-title-deco="icon-circle"] .preview-section:not([data-title-deco]) .preview-section-title{ gap:0.4em; }
  .preview-section[data-title-deco="underline"] .preview-section-title{ border-bottom:1.5px solid var(--preview-theme-light,var(--g-blue-light)); padding-bottom:0.1em; }
  .preview-section[data-title-deco="bar"] .preview-section-title{ border-left:3px solid var(--preview-theme,var(--g-blue)); padding-left:0.5em; }
  .preview-section[data-title-deco="block"] .preview-section-title{ background:var(--preview-theme,var(--g-blue)); color:white; padding:0.2em 0.6em; border-radius:var(--radius-sm); }
  .preview-section[data-title-deco="plain"] .preview-section-title{ border:none; padding:0; }
  .preview-section[data-title-deco="icon-circle"] .preview-section-icon{ display:inline-flex; align-items:center; justify-content:center; width:1.6em;height:1.6em; border-radius:50%; background:var(--preview-theme-light,var(--g-blue-light)); color:var(--preview-theme,var(--g-blue)); font-size:0.85em; flex-shrink:0; }
  .preview-section[data-title-deco="icon-circle"] .preview-section-title{ gap:0.4em; }

  /* 标题对齐 */
  [data-title-align="center"] .preview-section:not([data-title-align]) .preview-section-title{ justify-content:center; text-align:center; }
  .preview-section[data-title-align="center"] .preview-section-title{ justify-content:center; text-align:center; }

  /* 项目符号风格 */
  [data-bullet-style="dot"] .preview-section:not([data-bullet-style]) .preview-list{ list-style:disc }
  [data-bullet-style="square"] .preview-section:not([data-bullet-style]) .preview-list{ list-style:square }
  [data-bullet-style="dash"] .preview-section:not([data-bullet-style]) .preview-list{ list-style:none }
  [data-bullet-style="dash"] .preview-section:not([data-bullet-style]) .preview-list li::before{ content:'–'; margin-right:0.4em; color:var(--preview-theme,var(--g-blue)); }
  [data-bullet-style="arrow"] .preview-section:not([data-bullet-style]) .preview-list{ list-style:none }
  [data-bullet-style="arrow"] .preview-section:not([data-bullet-style]) .preview-list li::before{ content:'▸'; margin-right:0.4em; color:var(--preview-theme,var(--g-blue)); }
  [data-bullet-style="check"] .preview-section:not([data-bullet-style]) .preview-list{ list-style:none }
  [data-bullet-style="check"] .preview-section:not([data-bullet-style]) .preview-list li::before{ content:'✓'; margin-right:0.4em; color:var(--preview-theme,var(--g-blue)); }
  [data-bullet-style="none"] .preview-section:not([data-bullet-style]) .preview-list{ list-style:none; padding-left:0 }
  .preview-section[data-bullet-style="dot"] .preview-list{ list-style:disc }
  .preview-section[data-bullet-style="square"] .preview-list{ list-style:square }
  .preview-section[data-bullet-style="dash"] .preview-list{ list-style:none }
  .preview-section[data-bullet-style="dash"] .preview-list li::before{ content:'–'; margin-right:0.4em; color:var(--preview-theme,var(--g-blue)); }
  .preview-section[data-bullet-style="arrow"] .preview-list{ list-style:none }
  .preview-section[data-bullet-style="arrow"] .preview-list li::before{ content:'▸'; margin-right:0.4em; color:var(--preview-theme,var(--g-blue)); }
  .preview-section[data-bullet-style="check"] .preview-list{ list-style:none }
  .preview-section[data-bullet-style="check"] .preview-list li::before{ content:'✓'; margin-right:0.4em; color:var(--preview-theme,var(--g-blue)); }
  .preview-section[data-bullet-style="none"] .preview-list{ list-style:none; padding-left:0 }
  [data-bullet-style="dash"] .preview-list ul, [data-bullet-style="arrow"] .preview-list ul,
  [data-bullet-style="check"] .preview-list ul, [data-bullet-style="none"] .preview-list ul,
  [data-bullet-style="square"] .preview-list ul{ list-style:none; }

  /* 双栏布局（AI 变体可能切换） */
  .resume-body.dual-col{ display:flex; gap:calc(var(--resume-section-gap,1em) * 1.5); align-items:flex-start; }
  .resume-body.dual-col.dual-right{ flex-direction:row-reverse; }
  .resume-col-side{ flex:0 0 var(--resume-side-ratio, 34%); min-width:0; }
  .resume-col-main{ flex:1; min-width:0; }
  .resume-col .preview-section:last-child{ margin-bottom:0; }
  .resume-col-side .preview-section-title{ font-size:0.93em; }
  .resume-col-side .preview-list{ font-size:0.93em; }
  .resume-col-side .preview-block{ margin-bottom:calc(var(--resume-section-gap,1em) * 0.2); }
  .resume-body.sidebar-layout{ display:flex; gap:calc(var(--resume-section-gap,1em) * 1.4); align-items:flex-start; margin-top:calc(var(--resume-section-gap,1em) * 0.6); }
  .resume-body.sidebar-layout .resume-col-side{ flex:0 0 var(--resume-side-ratio, 28%); min-width:0; border-right:1px dashed var(--color-border,rgba(0,0,0,.1)); padding-right:calc(var(--resume-section-gap,1em) * 0.9); }
  .resume-body.sidebar-layout.sidebar-right{ flex-direction:row-reverse; }
  .resume-body.sidebar-layout.sidebar-right .resume-col-side{ border-right:none; padding-right:0; border-left:1px dashed var(--color-border,rgba(0,0,0,.1)); padding-left:calc(var(--resume-section-gap,1em) * 0.9); }

  /* 条目防分页断开 */
  .resume-paper[data-avoid-break="on"] .preview-block,
  .resume-paper[data-avoid-break="on"] .preview-list li{ break-inside:avoid; page-break-inside:avoid; }
  .resume-paper[data-avoid-break="on"] .preview-section-title{ break-after:avoid; page-break-after:avoid; }
</style>
</head>
<body>
  <div class="toolbar" role="toolbar" aria-label="简历操作">
    <span class="toolbar-title">旺财简历 · 静态预览</span>
    <button type="button" id="btn-pdf" class="print-button">导出 PDF</button>
    <button type="button" id="btn-edit" class="edit-button">在旺财简历中编辑</button>
    <span class="save-status" id="toolbar-hint"></span>
  </div>

  <main class="resume-paper" id="resume" aria-live="polite"></main>

  <script type="application/json" id="wc-resume-data">__WC_RESUME_DATA__</script>
  <script>
  (function () {
    'use strict';
    var SITE_BASE = 'https://wangcaiwork.top'; // 旺财编辑器站点
    var dataEl = document.getElementById('wc-resume-data');
    var resume = null;
    try { resume = JSON.parse(dataEl.textContent); } catch (e) { resume = null; }
    if (resume && resume.type === 'wangcai-resume' && resume.resume) resume = resume.resume;

    var esc = function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };

    // ---------- lucide 图标（与编辑器同源的 SVG path 数据） ----------
    var LUCIDE = {
      'user': '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      'briefcase': '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
      'activity': '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
      'cake': '<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.9-2 4-2 5 2 8 2 4-2 4-2"/><rect x="2" y="21" width="20" height="4" rx="1"/><path d="M12 7v4"/><path d="M12 7a2 2 0 1 0 .5-3.94"/>',
      'mail': '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
      'phone': '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
      'map-pin': '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
      'link': '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',

        var url = SITE_BASE.replace(/\/+$/, '') + '/builder.html#r=' + (isDeflated ? 'r1' : 'r0') + '.' + b64;
        btn.disabled = false;
        if (b64.length > 60000) {
          hint.style.color = '#b91c1c';
          hint.textContent = '数据较大（' + Math.round(b64.length / 1024) + 'KB），如打开异常请改用 wc-data.json 导入';
        } else {
          hint.textContent = '';
        }
        var w = window.open(url, '_blank', 'noopener');
        if (!w) location.href = url; // 弹窗被拦截时当前页跳转
      }

      if (typeof CompressionStream === 'function') {
        try {
          new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer()
            .then(function (buf) {
              var deflated = new Uint8Array(buf);
              var useDef = deflated.length < raw.length;
              finish(useDef ? deflated : raw, useDef);
            })
            .catch(function () { finish(raw, false); });
          return;
        } catch (e) { /* 落到 r0 */ }
      }
      finish(raw, false);
    });
  })();
  </script>
</body>
</html>
